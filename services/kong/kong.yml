_format_version: "3.0"

# ── Consumers ────────────────────────────────────────────────────────────────
# SMOKE_API_KEY is injected from the environment at Kong startup.
# Set it in .env (never commit the value — .env is gitignored).

consumers:
  - username: smoke-test-consumer

keyauth_credentials:
  - consumer: smoke-test-consumer
    key: $(SMOKE_API_KEY)

# ── Services & Routes ─────────────────────────────────────────────────────────

services:
  # Health check service — routes /health → LiteLLM /health/liveliness (no auth required)
  # strip_path: true strips the /health prefix; Kong appends remainder to service URL
  - name: litellm-health
    url: http://litellm:4000/health/liveliness
    connect_timeout: 5000
    read_timeout:    10000
    write_timeout:   10000

    routes:
      - name: litellm-health-route
        paths:
          - /health
        methods:
          - GET
        strip_path: true

  - name: litellm
    url: http://litellm:4000
    connect_timeout: 10000
    read_timeout:    60000
    write_timeout:   60000

    routes:

      # Model catalogue — read-only metadata, Kong → LiteLLM direct (no guardrails)
      - name: models-catalogue
        paths:
          - /v1/models
        methods:
          - GET
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: true

      # All other /v1 traffic (inference) — auth enforced here; guardrails added in Phase 03
      - name: litellm-proxy
        paths:
          - /v1
        methods:
          - GET
          - POST
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: true

  # ── Embeddings — dedicated service entry for 120 s batch timeout (feature 011) ──
  - name: litellm-embeddings
    url: http://litellm:4000
    connect_timeout: 10000
    read_timeout:    120000
    write_timeout:   120000

    routes:
      - name: litellm-embeddings-route
        paths:
          - /v1/embeddings
        methods:
          - POST
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: true

  # ── portal-backend — spend report (master key validated via LiteLLM proxy) ──
  - name: portal-backend
    url: http://portal-backend:8092
    connect_timeout: 10000
    read_timeout:    15000
    write_timeout:   15000

    routes:
      - name: spend-report
        paths:
          - /v1/spend
        methods:
          - GET
        strip_path: false

      - name: cache-flush
        paths:
          - /cache/flush
        methods:
          - DELETE
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: false
          - name: rate-limiting
            config:
              minute: 10
              policy: local

  # ── Batch inference API — async job submission, polling, and result download ──
  # Timeout is 600 s for result downloads (large JSONL files may take time to stream).
  - name: batch-api
    url: http://batch-api:8091
    connect_timeout: 10000
    read_timeout:    600000
    write_timeout:   600000

    routes:
      # GET prefix route — covers both status and results; FastAPI handles sub-routing.
      # Note: prefix routing avoids Kong Admin API form-encoding '+' as space in regex.
      - name: batch-jobs-read
        paths:
          - /v1/batch/jobs/
        methods:
          - GET
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: true

      - name: batch-jobs-submit
        paths:
          - /v1/batch/jobs
        methods:
          - POST
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: true

  # ── LiteLLM admin — key management (master key enforced by LiteLLM itself) ──
  - name: litellm-admin
    url: http://litellm:4000
    connect_timeout: 10000
    read_timeout:    30000
    write_timeout:   30000

    routes:
      - name: litellm-key-manage
        paths:
          - /v1/key
        methods:
          - GET
          - POST
          - DELETE
        strip_path: true

  # ── WebSocket streaming — feature 021 ────────────────────────────────────────
  # Routes /ws/v1/chat/completions to the guardrails service.
  # read_timeout / write_timeout set to 120 s to keep long-lived streams alive.
  # hide_credentials: false so Kong forwards X-Consumer-Username to guardrails
  # (needed for per-key connection-limit tracking). The API key is never forwarded
  # to LiteLLM — the guardrails WS handler strips it before the SSE call.
  - name: litellm-ws
    url: http://guardrails:8088
    connect_timeout: 5000
    read_timeout:    120000
    write_timeout:   120000

    routes:
      - name: ws-chat-completions
        paths:
          - /ws/v1/chat/completions
        protocols:
          - http
          - ws
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - Authorization
              key_in_header: true
              hide_credentials: false

# ── Global Plugins ────────────────────────────────────────────────────────────

plugins:
  # pre-function: strip any client-supplied correlation/trace headers so the
  # gateway always issues its own authoritative identifiers (FR-002).
  # Priority 1,000,000 — runs before correlation-id (100,001) and opentelemetry (100,000).
  - name: pre-function
    config:
      access:
        - |
          kong.request.clear_header("X-Request-ID")
          kong.request.clear_header("traceparent")
          kong.request.clear_header("tracestate")

  - name: correlation-id
    config:
      header_name:      X-Request-ID
      generator:        uuid
      echo_downstream:  true

  # opentelemetry: generate W3C traceparent/tracestate for upstream propagation
  # and emit spans to the OTel Collector for gateway.request_id enrichment (FR-005, FR-010).
  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong-gateway
      batch_span_count: 200
      batch_flush_delay: 3

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Platform: inference-platform"
          - "X-API-Version: 1"

  # request-size-limiting: reject payloads > 10 MB before forwarding to any upstream.
  # Protects against context-stuffing attacks (feature 015).
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
